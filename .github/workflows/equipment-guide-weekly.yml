name: Weekly equipment guide refresh

on:
  schedule:
    # Saturday 05:17 Asia/Seoul (Friday 20:17 UTC).
    - cron: '17 20 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equipment-guide-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Check automation credentials
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$NEXON_API_KEY" || { echo '::error::NEXON_API_KEY is required'; exit 1; }
          test -n "$SUPABASE_URL" || { echo '::error::NEXT_PUBLIC_SUPABASE_URL is required'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo '::error::SUPABASE_SERVICE_ROLE_KEY is required'; exit 1; }
      - run: npm ci
      - name: Test collection and publication rules
        run: node --experimental-strip-types --test scripts/equipment-guide*.test.mjs
      - name: Collect and validate character search index
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUIDE_MAX_REQUESTS: ${{ vars.EQUIPMENT_GUIDE_MAX_REQUESTS || '25000' }}
        run: node scripts/refresh-equipment-guide-index.mjs
